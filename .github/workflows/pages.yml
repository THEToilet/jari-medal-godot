name: Web版をGitHub Pagesに公開

# ルート … main の Web 版（2D）
# /virtual/ … 仮想筐体（3D）。VIRTUAL_BRANCH にブランチ名を入れるとそのブランチから、空なら main から作る
#             （書き出し設定「Web Virtual」が無ければ作らない）
# VIRTUAL_BRANCH に push したときは preview-trigger.yml がこのワークフローを main で動かす

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3
  VIRTUAL_BRANCH: ""   # 例: feature/virtual-cabinet（ブランチで試すときだけ入れる。preview-trigger.yml の branches も合わせる）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 仮想筐体のブランチを取得（あれば）
        run: |
          if [ -n "$VIRTUAL_BRANCH" ] && git ls-remote --exit-code --heads origin "$VIRTUAL_BRANCH" > /dev/null; then
            git fetch --depth 1 origin "$VIRTUAL_BRANCH"
            git worktree add "$RUNNER_TEMP/virtual" FETCH_HEAD
            echo "VIRTUAL_DIR=$RUNNER_TEMP/virtual" >> "$GITHUB_ENV"
          else
            echo "VIRTUAL_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Godot と Web 書き出しテンプレートを用意
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          python3 .github/scripts/fetch_web_templates.py \
            "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            version.txt web_nothreads_release.zip web_nothreads_debug.zip

      - name: Web 版を書き出し
        run: |
          mkdir -p build/web
          ./godot --headless --path . --import || true
          ./godot --headless --path . --export-release "Web" build/web/index.html
          # スマホのブラウザが古いゲームデータ（index.pck）を使い続けないよう、毎回URLを変える
          sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"index.pck?v=${GITHUB_SHA::8}\"/" build/web/index.html
          grep -o '"mainPack":"[^"]*"' build/web/index.html
          ls -la build/web

      - name: 仮想筐体を /virtual/ に書き出し
        run: |
          if ! grep -q '^name="Web Virtual"' "$VIRTUAL_DIR/export_presets.cfg"; then
            echo "書き出し設定 Web Virtual が無いのでスキップ"; exit 0
          fi
          touch "$GITHUB_WORKSPACE/build/.gdignore"   # main から作るとき、書き出し済みのファイルを読み込まないように
          out="$GITHUB_WORKSPACE/build/web/virtual"
          mkdir -p "$out"
          ./godot --headless --path "$VIRTUAL_DIR" --import || true
          ./godot --headless --path "$VIRTUAL_DIR" --export-release "Web Virtual" "$out/index.html"
          sha=$(git -C "$VIRTUAL_DIR" rev-parse --short=8 HEAD)
          sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"index.pck?v=${sha}\"/" "$out/index.html"
          grep -o '"mainPack":"[^"]*"' "$out/index.html"
          ls -la "$out"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
