name: 仮想筐体ブランチの更新をPagesに反映

# 仮想筐体のブランチに push したら、main の「Web版をGitHub Pagesに公開」を動かす。
# （Pages への公開は main からだけなので、ブランチでは直接公開しない）
on:
  push:
    branches: [feature/virtual-cabinet]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
